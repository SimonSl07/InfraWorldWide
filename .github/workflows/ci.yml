name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fast fail: schema + geometry cross-checks before anything expensive.
      - name: Validate data
        run: npm run data:validate

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # Runs data:build via prebuild, so this also covers the build pipeline.
      - name: Build
        run: npm run build
